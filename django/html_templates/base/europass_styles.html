<style>
        /* --- Base Variables --- */
        :root {
            /* MODERNIZED COLOR PALETTE */
            --theme-primary-dark: #2d3748;   /* For headings and titles */
            --theme-primary-accent: #2b6cb0;  /* A softer, professional blue */
            --theme-sidebar-bg: #f7fafc;      /* A very light, neutral grey */
            --theme-text-main: #4a5568;      /* Main body text */
            --theme-text-muted: #718096;     /* For dates and subtitles */
            --theme-border-soft: #e2e8f0;    /* A subtle border color */

            /* UNIFIED FONT FAMILY */
            --font-family-primary: 'Source Sans Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            --font-family-heading: 'Source Sans Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            
            /* Font Size Variables (Structure Unchanged) */
            --font-size-sm: 9pt;
            --font-size-md: 10pt;
            --font-size-lg: 11.5pt;

            /* Default to medium font size */
            --base-font-size: var(--font-size-md);
            --h1-font-size: 1.8rem;
            --h2-font-size: 1.3rem;
            --h3-font-size: 1rem;
            
            /* Content font sizes that scale */
            --headline-font-size: 1.1rem;
            --contact-font-size: 0.9rem;
            --item-title-font-size: 1.1rem;
            --item-subtitle-font-size: 1rem;
            --item-date-font-size: 0.9rem;
            --item-description-font-size: 0.95rem;
            --skill-category-font-size: 0.95rem;
            --skill-item-font-size: 0.85rem;

            /* GENEROUS SPACING */
            --spacing-xs: 0.25em;
            --spacing-sm: 0.5em;
            --spacing-md: 0.8em;
            --spacing-lg: 1.2em;
            --spacing-xl: 1.6em;

            --line-height: 1.6; /* Increased for better readability */
        }

        /* --- Font Size Options with scaled spacing (Structure Unchanged) --- */
        body.font-size-small {
            --base-font-size: var(--font-size-sm);
            --h1-font-size: 1.6rem;
            --h2-font-size: 1.2rem;
            --h3-font-size: 1rem;
            --headline-font-size: 1rem;
            --contact-font-size: 0.8rem;
            --item-title-font-size: 1rem;
            --item-subtitle-font-size: 0.9rem;
            --item-date-font-size: 0.8rem;
            --item-description-font-size: 0.85rem;
            --skill-category-font-size: 0.85rem;
            --skill-item-font-size: 0.75rem;
            --line-height: 1.5;
        }
        body.font-size-large {
            --base-font-size: var(--font-size-lg);
            --h1-font-size: 2rem;
            --h2-font-size: 1.4rem;
            --h3-font-size: 1.1rem;
            --headline-font-size: 1.25rem;
            --contact-font-size: 1rem;
            --item-title-font-size: 1.25rem;
            --item-subtitle-font-size: 1.1rem;
            --item-date-font-size: 1rem;
            --item-description-font-size: 1.05rem;
            --skill-category-font-size: 1.05rem;
            --skill-item-font-size: 0.95rem;
            --line-height: 1.7;
        }

        /* --- Theme Variations (Structure Unchanged, Colors Updated) --- */
        body.theme-grey {
            --theme-primary-dark: #343a40;
            --theme-primary-accent: #6c757d;
            --theme-sidebar-bg: #f8f9fa;
            --theme-text-main: #495057;
            --theme-border-soft: #dee2e6;
        }
        body.theme-blue {
            --theme-primary-dark: #004085;
            --theme-primary-accent: #007bff;
            --theme-sidebar-bg: #e7f3ff;
            --theme-text-main: #212529;
            --theme-border-soft: #b8daff;
        }
        body.theme-green {
            --theme-primary-dark: #155724;
            --theme-primary-accent: #28a745;
            --theme-sidebar-bg: #d4edda;
            --theme-text-main: #343a40;
            --theme-border-soft: #c3e6cb;
        }

        /* --- Font Family Definitions (Structure Unchanged) --- */
        body.sourcesans-sourceserif, :root {
            --font-family-main: 'Source Sans Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            --font-family-heading: 'Source Sans Pro', 'Source Sans Pro', Georgia, serif;
        }
        body.calibri-times {
            --font-family-main: 'Calibri', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            --font-family-heading: 'Times New Roman', 'Calibri', Times, serif;
        }
        body.arial-georgia {
            --font-family-main: 'Arial', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            --font-family-heading: 'Georgia', 'Arial', serif;
        }
        body.roboto-robotoslab {
            --font-family-main: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            --font-family-heading: 'Roboto Slab', 'Roboto', Georgia, serif;
        }

        /* PAGE SETUP - UNCHANGED */
        @page {
            size: A4;
            margin: 0.2cm;
            orphans: 2;
            widows: 2;
        }

        body {
            font-family: var(--font-family-primary);
            font-size: var(--base-font-size);
            line-height: var(--line-height);
            color: var(--theme-text-main);
            background-color: #ffffff;
            margin: 0;
            padding: 0;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: var(--font-family-heading);
            color: var(--theme-primary-dark);
        }
        
        /* LAYOUT - UNCHANGED */
        .sidebar {
            float: left;
            width: 35%;
            height: 1105px;
            background-color: var(--theme-sidebar-bg);
            padding: var(--spacing-lg) var(--spacing-md); /* Increased padding */
            margin-right: var(--spacing-md);
            border-right: 1px solid var(--theme-border-soft); /* Softened border */
            box-sizing: border-box;
            padding-top: 2em; /* Adjusted top padding */
        }
        .main-content {
            list-style-position: inside;
            padding: var(--spacing-lg) var(--spacing-lg) var(--spacing-md) var(--spacing-lg); /* Increased padding */
            box-sizing: border-box;
        }
       
        /* Sidebar Styling - Better spacing and layout */
        .sidebar h1 {
            font-size: var(--h1-font-size);
            color: var(--theme-primary-dark);
            margin: 0 0 var(--spacing-xs) 0;
            font-weight: 700;
            text-align: center; 
            line-height: 1.2;
        }
        
        .sidebar .headline {
            font-size: var(--headline-font-size);
            color: var(--theme-text-muted);
            margin-bottom: var(--spacing-xl); /* Increased margin */
            font-weight: 400; /* Softened font weight */
            text-align: center;
            line-height: 1.3;
        }
        
        .sidebar-section {
            margin-bottom: var(--spacing-lg);
        }
        
        .sidebar-section:last-child {
            margin-bottom: 0;
        }
        
        .sidebar-section h3 {
            font-size: var(--h3-font-size);
            color: var(--theme-primary-dark);
            border-bottom: none; /* REMOVED BORDER */
            padding-bottom: 0;
            margin-bottom: var(--spacing-md); /* Increased margin */
            font-weight: 600;
            text-transform: uppercase; /* Added for style */
            letter-spacing: 0.5px; /* Added for style */
        }
        
        .sidebar-section h3 i.icon {
            margin-right: var(--spacing-sm); /* Increased margin */
            font-size: 0.9em;
            color: var(--theme-primary-accent); /* Use accent color */
        }
        
        .contact-info {
            list-style: none;
            padding: 0;
            margin: 0;
            font-size: var(--contact-font-size);
        }
        
        .contact-info li {
            margin-bottom: var(--spacing-sm);
            display: flex;
            align-items: flex-start;
            line-height: 1.4;
        }
        
        .contact-info i.icon {
            color: var(--theme-primary-accent);
            margin-right: var(--spacing-sm);
            width: 1.2em;
            text-align: center;
            margin-top: 0.2em; /* Adjusted for alignment */
            flex-shrink: 0;
        }
        
        .contact-info a {
            color: var(--theme-text-main);
            text-decoration: none;
            word-break: break-word;
        }
        
        .contact-info a:hover {
            text-decoration: underline;
            color: var(--theme-primary-accent);
        }
        
        .sidebar-avatar {
            width: 7em; /* Increased size */
            height: 7em;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            margin: 0 auto var(--spacing-lg) auto;
            border: 4px solid #ffffff; /* Simplified border */
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); /* Softened shadow */
        }
        
        .skills-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        
        .skills-list .skill-category {
            font-weight: 600; /* Softened weight */
            color: var(--theme-primary-dark);
            margin-top: var(--spacing-md);
            margin-bottom: var(--spacing-sm); /* Increased margin */
            font-size: var(--skill-category-font-size);
            line-height: 1.3;
        }
        
        .skills-list .skill-category:first-child {
            margin-top: 0;
        }
        
        .skills-list li:not(.skill-category) {
            background-color: #ffffff; /* MODERNIZED SKILL PILLS */
            border: 1px solid var(--theme-border-soft);
            color: var(--theme-text-muted);
            padding: var(--spacing-sm) var(--spacing-md);
            border-radius: 20px;
            margin-bottom: var(--spacing-sm);
            margin-right: var(--spacing-sm);
            display: inline-block;
            font-size: var(--skill-item-font-size);
            line-height: 1;
        }

        /* Main Content Styling */
        .main-content h2 {
            font-size: var(--h2-font-size);
            color: var(--theme-primary-dark);
            margin: 0 0 var(--spacing-lg) 0;
            padding-bottom: var(--spacing-sm);
            padding-left: 0;
            border-left: none; /* REMOVED BORDER */
            border-bottom: 1px solid var(--theme-border-soft); /* Replaced with subtle underline */
            font-weight: 600;
            page-break-after: avoid; /* UNCHANGED */
            line-height: 1.3;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .main-content h2 i {
            margin-right: var(--spacing-md); /* Increased margin */
            font-size: 0.9em;
            color: var(--theme-primary-accent);
        }
        
        .main-content h2:first-child {
            margin-top: 0;
        }
        
        /* UNCHANGED SECTION & PAGE BREAK RULES */
        .main-content section {
            margin-bottom: var(--spacing-xl);
            page-break-inside: auto;
        }
        .main-content section:last-child {
            margin-bottom: 0;
        }
        .item {
            margin-bottom: var(--spacing-lg);
            padding-left: 0; 
            margin-left: 0;
            page-break-inside: auto;
            position: relative;
        }
        .item.keep-together {
            page-break-inside: avoid;
        }
        .item-header {
            margin-bottom: var(--spacing-sm);
            page-break-after: avoid;
        }
        
        .main-content p {
            margin: 0 0 var(--spacing-md) 0;
            line-height: 1.6;
        }
        
        .main-content ul {
            padding-left: var(--spacing-xl);
            margin-top: var(--spacing-sm);
            margin-bottom: var(--spacing-lg);
            list-style-position: inside;
        }
        
        .main-content li {
            margin-bottom: var(--spacing-sm); /* Increased margin */
            line-height: 1.5;
        }

        .title {
            font-size: var(--item-title-font-size);
            font-weight: 600;
            color: var(--theme-primary-dark);
            display: block;
            margin-bottom: var(--spacing-xs);
            line-height: 1.3;
        }
        
        .subtitle {
            font-size: var(--item-subtitle-font-size);
            font-weight: 400; /* Softened weight */
            color: var(--theme-text-muted);
            display: block;
            margin-bottom: var(--spacing-xs);
            line-height: 1.3;
        }
        
        .item-date-location {
            font-size: var(--item-date-font-size);
            color: var(--theme-text-muted);
            font-weight: 400;
            margin-bottom: var(--spacing-md);
            line-height: 1.2;
        }
        
        .item-date-location .location { 
            color: var(--theme-text-muted);
            margin-left: var(--spacing-lg); 
        }

        .item .description {
            font-size: var(--item-description-font-size);
            line-height: 1.5;
        }
        
        .item .description ul {
            list-style: disc;
            margin-top: var(--spacing-xs);
            margin-bottom: var(--spacing-sm);
        }
        
        .item .description ul li {
            margin-bottom: var(--spacing-xs);
        }
        
        .project-link, .project-tech {
            font-size: var(--item-date-font-size);
            margin-top: var(--spacing-md);
            line-height: 1.3;
        }
        
        .project-link i { 
            color: var(--theme-primary-accent); 
            margin-right: var(--spacing-xs); 
        }
        
        .project-tech strong { 
            font-weight: 600; 
        }

        /* RTL Support (Structure Unchanged, Colors Updated) */
        html[lang="ar"] body { direction: rtl; text-align: right; }
        html[lang="ar"] .resume-container { flex-direction: row-reverse; }
        html[lang="ar"] .sidebar { border-right: none; border-left: 1px solid var(--theme-border-soft); }
        html[lang="ar"] .sidebar h1, html[lang="ar"] .sidebar .headline { text-align: center; }
        html[lang="ar"] ul { padding-left: 0; padding-right: var(--spacing-xl); }
        html[lang="ar"] .sidebar ul { padding-right: 0; }
        html[lang="ar"] .main-content h2 { padding-left: 0; padding-right: 0; border-left: none; border-right: none; border-bottom: 1px solid var(--theme-border-soft); }
        html[lang="ar"] .main-content h2 i { margin-right: 0; margin-left: var(--spacing-md); }
        html[lang="ar"] .main-content .item { padding-left: 0; padding-right: 0; margin-left: 0; margin-right: 0; }
        html[lang="ar"] i.icon { margin-right: 0; margin-left: var(--spacing-sm); }
        html[lang="ar"] .sidebar-section h3 i.icon { margin-right: 0; margin-left: var(--spacing-sm); }
        html[lang="ar"] .skills-list li { margin-right: 0; margin-left: var(--spacing-sm); }
        html[lang="ar"] .item-date-location .location { margin-left: 0; margin-right: var(--spacing-lg); }
        html[lang="ar"] .project-link i { margin-right: 0; margin-left: var(--spacing-xs); }
</style>
