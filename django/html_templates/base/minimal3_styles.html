<style>

/*
 * This is a LaTeX-inspired CSS template for a resume.
 * It's designed to be clean, professional, and highly customizable.
 * The structure mimics common LaTeX resume classes, using CSS variables for easy styling.
 * The goal is to provide a "smarter" version of the Monoline Compact template by:
 * - Improving semantic clarity and organization.
 * - Using more standardized and robust CSS practices.
 * - Enhancing the typographical hierarchy and spacing for a more refined look.
 * - Maintaining the core monoline, compact aesthetic while introducing subtle improvements.
 */

:root {
  /* --- Color Palette (Default: #333333, Slate Gray) --- */
  --primary-color: #5d6d7e; /* A slightly darker, professional blue-gray */
  --border-color: #d1d9e2;
  --heading-color: #2c3e50; /* Dark, professional heading color */
  --text-color: #333333; /* Standard dark text */
  --muted-color: #7f8c8d; /* Muted gray for dates and secondary info */
  --page-bg-color: #ffffff;

  /* --- Font Families (Default: Fira Sans + Merriweather) --- */
  --font-family-main: 'Fira Sans', sans-serif;
  --font-family-heading: 'Merriweather', serif;

  /* --- Font Size Variables (Compact) --- */
  --font-size-sm: 9pt;
  --font-size-md: 10pt;
  --font-size-lg: 11pt;

  /* Default to medium font size */
  --base-font-size: var(--font-size-md);
  --h1-font-size: 2.2rem;
  --h2-font-size: 1.15rem;

  /* Component-specific font sizes for scaling */
  --headline-font-size: 1.1rem;
  --contact-font-size: 0.95rem;
  --item-title-font-size: 1.05rem;
  --item-subtitle-font-size: 1.0rem;
  --item-date-font-size: 0.9rem;
  --item-description-font-size: 0.95rem;
  --skill-category-font-size: 0.95rem;
  --skill-keyword-font-size: 0.9rem;

  /* --- Spacing (Refined Compact) --- */
  --spacing-xxs: 0.15rem;
  --spacing-xs: 0.25rem;
  --spacing-sm: 0.5rem;
  --spacing-md: 0.8rem;
  --spacing-lg: 1.2rem;
  --spacing-xl: 1.8rem;

  --line-height: 1.5;
}

/* --- FONT SIZE SCALER --- */
body.font-size-small {
  --base-font-size: var(--font-size-sm);
  --line-height: 1.4;
  --h1-font-size: 2.0rem;
  --h2-font-size: 1.05rem;
  --headline-font-size: 1.0rem;
  --contact-font-size: 0.85rem;
  --item-title-font-size: 0.95rem;
  --item-subtitle-font-size: 0.9rem;
  --item-date-font-size: 0.85rem;
  --item-description-font-size: 0.9rem;
  --skill-category-font-size: 0.9rem;
  --skill-keyword-font-size: 0.85rem;
}
body.font-size-large {
  --base-font-size: var(--font-size-lg);
  --line-height: 1.6;
  --h1-font-size: 2.4rem;
  --h2-font-size: 1.25rem;
  --headline-font-size: 1.2rem;
  --contact-font-size: 1.0rem;
  --item-title-font-size: 1.15rem;
  --item-subtitle-font-size: 1.1rem;
  --item-date-font-size: 1.0rem;
  --item-description-font-size: 1.05rem;
  --skill-category-font-size: 1.05rem;
  --skill-keyword-font-size: 1.0rem;
}

/* --- THEME DEFINITIONS --- */
body.theme-slate-gray {
  --primary-color: #5d6d7e;
  --border-color: #d1d9e2;
}
body.theme-burgundy {
  --primary-color: #88304e;
  --border-color: #e5b8c6;
}
body.theme-forest-green {
  --primary-color: #2e8b57;
  --border-color: #b3e0c7;
}
body.theme-deep-purple {
  --primary-color: #6a0dad;
  --border-color: #d4c1e4;
}

/* --- FONT FAMILY DEFINITIONS --- */
body.fira-merriweather {
  --font-family-main: 'Fira Sans', sans-serif;
  --font-family-heading: 'Merriweather', serif;
}
body.lato-roboto-slab {
  --font-family-main: 'Lato', sans-serif;
  --font-family-heading: 'Roboto Slab', serif;
}
body.inter-lora {
  --font-family-main: 'Inter', sans-serif;
  --font-family-heading: 'Lora', serif;
}
body.open-sans-playfair {
  --font-family-main: 'Open Sans', sans-serif;
  --font-family-heading: 'Playfair Display', serif;
}

/* --- BASE STYLES --- */
@page {
  size: A4;
  margin: 1.5cm 1.5cm 1.5cm 1.5cm;
}

body {
  font-family: var(--font-family-main);
  font-size: var(--base-font-size);
  line-height: var(--line-height);
  color: var(--text-color);
  background-color: var(--page-bg-color);
  margin: 0;
  padding: 0;
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}

h1,
h2 {
  font-family: var(--font-family-heading);
  margin: 0;
  font-weight: 700;
  color: var(--heading-color);
}
h1 {
  font-size: var(--h1-font-size);
  margin-bottom: var(--spacing-sm);
}
h2 {
  font-size: var(--h2-font-size);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  padding-bottom: var(--spacing-xs);
  margin-top: var(--spacing-xl);
  margin-bottom: var(--spacing-md);
  color: var(--heading-color);
  position: relative;
}
h2::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 1px;
  background-color: var(--border-color);
}
h2:first-of-type {
  margin-top: 0;
}
a {
  color: var(--primary-color);
  text-decoration: none;
  font-weight: 600;
}
a:hover {
  text-decoration: underline;
}

/* --- HEADER SECTION --- */
.resume-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-end; /* Keeps name and contact info aligned at the bottom */
  position: relative; /* Essential for positioning the avatar inside */
  margin-bottom: var(--spacing-lg);
  padding-bottom: var(--spacing-sm);
  border-bottom: 2px solid var(--primary-color);
}
.header-avatar-side {
  position: absolute;
  bottom: var(--spacing-sm);
  right: 0;
  width: 10em;
  height: 10em;
  border-radius: 50%;
  object-fit: cover;
  border: 1px solid var(--primary-color);
  background: white;
  box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
}

.header-text-content {
  flex-grow: 1;
  padding-right: 12em;
}
.headline {
  font-size: var(--headline-font-size);
  color: var(--text-color);
  margin: 0;
}
.contact-info {
  list-style: none;
  padding: 0;
  margin: 0;
  text-align: right;
  font-size: var(--contact-font-size);
  color: var(--muted-color);
}
.contact-info li {
  line-height: 1.4;
}

/* --- MAIN CONTENT SECTIONS --- */
.item {
  margin-bottom: var(--spacing-lg);
}
.item:last-child {
  margin-bottom: 0;
}

.item-header-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: var(--spacing-xxs);
}
.item-title-org {
  flex-grow: 1;
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
}
.item-title-org .title {
  font-family: var(--font-family-heading);
  font-weight: 700;
  font-size: var(--item-title-font-size);
  color: var(--heading-color);
}
.item-title-org .organization {
  font-style: italic;
  font-size: var(--item-subtitle-font-size);
  color: var(--muted-color);
  margin-left: var(--spacing-sm);
}
.item-date-location {
  font-size: var(--item-date-font-size);
  color: var(--muted-color);
  text-align: right;
  flex-shrink: 0;
  white-space: nowrap;
}

.item .description {
  font-size: var(--item-description-font-size);
  margin-top: var(--spacing-xxs);
}
.item .description ul {
  list-style-type: disc;
  padding-left: 20px;
  margin: 0;
}
.item .description ul li {
  margin-bottom: var(--spacing-xxs);
}

/* --- SKILLS SECTION (Text-Based) --- */
.skill-group {
  margin-bottom: var(--spacing-sm);
}
.skill-category-title {
  font-size: var(--skill-category-font-size);
  font-weight: 700;
  color: var(--heading-color);
  display: inline;
}
.skill-category-title::after {
  content: ": ";
}
.skill-keywords {
  display: inline;
  list-style: none;
  padding: 0;
  margin: 0;
}
.skill-keywords li {
  display: inline;
  font-size: var(--skill-keyword-font-size);
  color: var(--text-color);
}
.skill-keywords li:not(:last-child)::after {
  content: ", ";
}
</style>
