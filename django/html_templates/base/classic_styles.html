<style>
    /* --- Gridline Modern Template --- */
    :root {
        /* Default theme is Slate & Crimson */
        /* --- Color Palette --- */
        --primary-color: #DC2626;  /* Crimson Red */
        --heading-color: #111827;  /* Almost Black */
        --text-color: #374151;    /* Dark Slate */
        --muted-color: #6B7280;   /* Medium Slate */
        --border-color: #E5E7EB;   /* Light Slate */
        --page-bg-color: #FFFFFF;
        --skill-tag-bg: #F9FAFB;
        --skill-tag-border: #F3F4F6;
        --header-bg: #F9FAFB;

        /* Default font is Roboto & Raleway */
        /* --- Font Families --- */
        --font-family-main: 'Roboto', sans-serif;
        --font-family-heading: 'Raleway', sans-serif;
        
        /* --- Font Size Variables (Compact) --- */
        --base-font-size: 10pt;
        --h1-font-size: 2rem;
        --h2-font-size: 1rem;
        
        /* --- Spacing (Hyper-Compact) --- */
        --spacing-xs: 0.2rem;
        --spacing-sm: 0.35rem;
        --spacing-md: 0.5rem;
        --spacing-lg: 0.8rem;
        --spacing-xl: 1.4rem;
        
        --line-height: 1.35;
    }

    /* --- THEME DEFINITIONS --- */
    body.theme-slate-crimson { /* This is the default */ }
    body.theme-forest-mint {
        --primary-color: #10B981;  /* Mint Green */
        --heading-color: #064E3B;  /* Deep Forest Green */
        --text-color: #374151;
        --muted-color: #6B7280;
        --border-color: #E5E7EB;
        --skill-tag-bg: #F0FDF4;
        --skill-tag-border: #D1FAE5;
        --header-bg: #F0FDF4;
    }
    body.theme-midnight-gold {
        --primary-color: #D97706;  /* Warm Gold */
        --heading-color: #1E3A8A;  /* Midnight Blue */
        --text-color: #374151;
        --muted-color: #6B7280;
        --border-color: #E5E7EB;
        --skill-tag-bg: #FEFCE8;
        --skill-tag-border: #FEF9C3;
        --header-bg: #FEFCE8;
    }

    /* --- FONT FAMILY DEFINITIONS --- */
    body.font-roboto-raleway { /* This is the default */ }
    body.font-lato-merriweather {
        --font-family-main: 'Lato', sans-serif;
        --font-family-heading: 'Merriweather', serif;
    }
    body.font-sourcesans-oswald {
        --font-family-main: 'Source Sans Pro', sans-serif;
        --font-family-heading: 'Oswald', sans-serif;
    }

    @page { size: A4; margin: 1.6cm; }
    
    body {
        font-family: var(--font-family-main);
        font-size: var(--base-font-size); 
        line-height: var(--line-height);
        color: var(--text-color); 
        background-color: var(--page-bg-color);
        margin: 0; padding: 0;
        -webkit-print-color-adjust: exact; 
        print-color-adjust: exact;
    }

    h1, h2 {
        font-family: var(--font-family-heading);
        margin: 0;
        color: var(--heading-color);
    }
    h1 { font-size: var(--h1-font-size); font-weight: 700; margin-bottom: var(--spacing-sm); }
    h2 {
        font-size: var(--h2-font-size); 
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-top: var(--spacing-xl);
        margin-bottom: var(--spacing-lg);
        padding-left: var(--spacing-md);
        padding-bottom: var(--spacing-sm);
        border-left: 2px solid var(--primary-color);
        border-bottom: 1px solid var(--border-color);
    }
    h2:first-of-type { margin-top: var(--spacing-md); }
    a { color: var(--primary-color); text-decoration: none; }
    a:hover { text-decoration: underline; }
    
    /* --- Header Section --- */
    .resume-header {
        margin-bottom: var(--spacing-xl);
        padding: var(--spacing-lg);
        background-color: var(--header-bg);
        border-bottom: 1px solid var(--border-color);
    }

    .header-content-wrapper {
        display: flex;
        align-items: center;
        gap: var(--spacing-lg);
    }
    .header-avatar-side {
        width: 6em; height: 6em;
        border-radius: 50%; object-fit: cover;
        flex-shrink: 0; border: 2px solid var(--border-color);
    }
    .header-text-content {
        width: 100%;
    }
    .header-text-content .headline {
        margin-bottom: var(--spacing-md);
        color: var(--text-color);
        font-size: 1.05em;
    }
    .contact-info {
        list-style: none; padding: 0; margin: 0;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: var(--spacing-xs) var(--spacing-lg);
        font-size: 0.9em;
    }
    .contact-info li, .contact-info i { padding: 0; text-indent: 0; }
    .contact-info i { color: var(--muted-color); margin-right: var(--spacing-sm); }

    /* --- Main Content Sections --- */
    .item { margin-bottom: var(--spacing-lg); }
    .item:last-child { margin-bottom: 0; }

    .item-header-row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: var(--spacing-xs);
    }
    .item-title-org .title {
        font-family: var(--font-family-heading);
        font-weight: 600;
        font-size: 1.05em;
        color: var(--heading-color);
    }
    .item-title-org .organization {
        color: var(--text-color);
        margin-left: var(--spacing-sm);
    }
    .item-date-location {
        font-size: 0.9em; color: var(--muted-color);
        text-align: right; flex-shrink: 0;
    }
    
    /* --- TWO-TIER HIERARCHY IMPLEMENTATION --- */
    .item .description ul { list-style: none; padding: 0; margin: 0; }
    .item .description ul li { display: inline; padding: 0; text-indent: 0; margin: 0; }
    .item .description ul li::before { content: ""; width: 0; margin: 0; }
    .item .description ul li:not(:last-child)::after { content: "; "; white-space: pre; }
    .item .description ul li:last-child::after { content: "."; }
    
    /* --- Skills Section --- */
    .skill-group { margin-bottom: var(--spacing-md); }
    .skill-category-title {
        font-family: var(--font-family-heading);
        font-weight: 600;
        font-size: 1em;
        margin-bottom: var(--spacing-sm);
        color: var(--heading-color);
    }
    .skill-keywords {
        list-style: none; padding: 0; margin: 0;
        display: flex; flex-wrap: wrap;
        gap: var(--spacing-sm);
    }
    .skill-keywords li {
        font-size: 0.9em;
        background-color: var(--skill-tag-bg);
        color: var(--text-color);
        padding: var(--spacing-xs) var(--spacing-md);
        border-radius: 2px; /* Sharp corners */
        border: 1px solid var(--skill-tag-border);
        margin: 0; padding-left: var(--spacing-md); text-indent: 0;
    }
    .skill-keywords li::before { content: ""; display: none; }
</style>
